name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
          SECRET_KEY: ci-test-secret
          ENVIRONMENT: development
        run: pytest -v

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web_app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
